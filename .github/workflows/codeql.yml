# Static analysis for security bugs and code quality problems in the Python and TypeScript
# code and in the workflow files themselves. Results appear under Security > Code scanning.
# This is the advanced setup, so GitHub's "default setup" for code scanning must stay off.
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # New queries ship weekly, so the code is re-checked even when nothing changes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

      - name: What CodeQL found
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: ./.github/scripts/codeql-report.sh "$SARIF_DIRECTORY"
