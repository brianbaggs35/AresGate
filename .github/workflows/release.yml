# Publishes AresGate's container image when a GitHub release is published.
#
# The image is built, scanned and smoke tested for each CPU (amd64 and arm64, each on a runner
# of its own, so neither is emulated). Only when both pass is each image pushed, and then the
# two are joined into one multi-platform image tagged x.y.z, x.y, x and latest (a pre-release
# only gets its own version), with a signed build provenance and an SBOM for it. The SBOMs are
# attached to the release too.
#
# It runs only when a release is published (a saved draft doesn't start it), and nothing else
# triggers it.
name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

# Actions are pinned to full commit SHAs so a moved or hijacked tag can't change what runs. This
# workflow publishes, so it doesn't use a build cache that a pull request could have written.
jobs:
  validate:
    name: Check the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, to check the release is made from master.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag and work out the image tags
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: ./.github/scripts/release-version.sh

      # Fixes land on master through reviewed pull requests, so a release has to be made from there.
      - name: Check the release is made from master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::The release's tag isn't on master. Create the release from a commit on master."
            exit 1
          fi

  build:
    name: Build and test (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      ARESGATE_VERSION: release
      ARESGATE_HTTPS_PORT: 8443
      ARESGATE_HTTP_PORT: 8080
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE: ${{ needs.validate.outputs.image }}
      # Optional: a Chainguard pull token, which raises the pull limits on cgr.dev. The base
      # image is public, so the build works without it.
      CHAINGUARD_PULL_USERNAME: ${{ secrets.CHAINGUARD_PULL_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Chainguard
        if: ${{ env.CHAINGUARD_PULL_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cgr.dev
          username: ${{ secrets.CHAINGUARD_PULL_USERNAME }}
          password: ${{ secrets.CHAINGUARD_PULL_PASSWORD }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Today's date, to refresh cached OS packages daily
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Wolfi publishes package fixes all day, so every package in the image is upgraded when
      # it's built: nothing comes from a cached layer, and nothing is cached for next time.
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: aresgate:release
          provenance: false
          sbom: false
          build-args: |
            RELEASE=${{ env.VERSION }}
            APK_REFRESH=${{ steps.date.outputs.today }}
            IMAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=AresGate
            org.opencontainers.image.description=A self-hosted AI security analyst for your home network
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check the image knows its version
        run: |
          stamped="$(docker run --rm --entrypoint sh aresgate:release -c 'echo "$ARESGATE_RELEASE"')"
          if [[ "$stamped" != "$VERSION" ]]; then
            echo "::error::The image reports version '$stamped', not '$VERSION'."
            exit 1
          fi

      - name: Trivy scan of the image
        id: trivy-image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: aresgate:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "1"
        continue-on-error: true

      - name: Show the image scan findings
        if: ${{ steps.trivy-image.outcome == 'failure' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: image
          image-ref: aresgate:release
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

      # A release with a known high or critical vulnerability that has a fix isn't published.
      - name: Enforce the Trivy scan threshold
        env:
          IMAGE_SCAN_OUTCOME: ${{ steps.trivy-image.outcome }}
        run: ./.github/scripts/trivy-report.sh image "$IMAGE_SCAN_OUTCOME" trivy-image.sarif

      - name: List what's in the image (SBOM)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: image
          image-ref: aresgate:release
          format: spdx-json
          output: sbom-${{ matrix.arch }}.spdx.json

      - name: Start the stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: ./.github/scripts/smoke-test.sh

      - name: Restart on the existing data
        run: |
          docker compose down
          docker compose up --detach --no-build --wait --wait-timeout 180
          ./.github/scripts/smoke-test.sh

      - name: Container logs
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes

      # The same build again, from the layers just built and tested, so what's pushed is what
      # was scanned.
      - name: Push the image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          build-args: |
            RELEASE=${{ env.VERSION }}
            APK_REFRESH=${{ steps.date.outputs.today }}
            IMAGE_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=AresGate
            org.opencontainers.image.description=A self-hosted AI security analyst for your home network
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Check the pushed image is the one that was tested
        env:
          TESTED: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.config.digest'] }}
          PUSHED: ${{ fromJSON(steps.push.outputs.metadata)['containerimage.config.digest'] }}
        run: |
          echo "tested: $TESTED"
          echo "pushed: $PUSHED"
          if [[ -z "$TESTED" || "$TESTED" != "$PUSHED" ]]; then
            echo "::error::The image that was pushed isn't the one that was scanned and tested."
            exit 1
          fi

      - name: Keep the image's digest for the next job
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir digests
          echo "$DIGEST" > "digests/$ARCH"

      - name: Upload the image's digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the image
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # tag the image in ghcr.io
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE: ${{ needs.validate.outputs.image }}
      TAGS: ${{ needs.validate.outputs.tags }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download the images' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the images into one multi-platform image
        id: join
        run: |
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$IMAGE:$tag")
          done <<<"$TAGS"
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw |
            jq --exit-status '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64", "linux/arm64"]' >/dev/null
          {
            echo "amd64=$amd64"
            echo "arm64=$arm64"
            echo "index=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.index }}
          push-to-registry: true

      - name: Sign the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.amd64 }}
          sbom-path: sboms/sbom-amd64.spdx.json
          push-to-registry: true

      - name: Sign the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.arm64 }}
          sbom-path: sboms/sbom-arm64.spdx.json
          push-to-registry: true

      # What anyone pulling the image can run to check it was built by this workflow.
      - name: Check the provenance verifies
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX: ${{ steps.join.outputs.index }}
        run: gh attestation verify "oci://$IMAGE@$INDEX" --repo "$GITHUB_REPOSITORY"

      - name: Summary
        env:
          INDEX: ${{ steps.join.outputs.index }}
        run: |
          {
            echo "### Published $IMAGE"
            echo
            echo "Tags: ${TAGS//$'\n'/, }"
            echo
            echo "Digest: \`$INDEX\`"
            echo
            echo "Check where it came from: \`gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The SBOMs, for anyone who wants to read them without pulling the image.
  release-assets:
    name: Attach the SBOMs to the release
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # add files to the release
    steps:
      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true

      - name: Upload them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            mv "sboms/sbom-$arch.spdx.json" "sboms/aresgate-$VERSION-linux-$arch.spdx.json"
          done
          gh release upload "$TAG" sboms/*.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
