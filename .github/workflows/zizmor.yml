# Audits the workflow files for the mistakes that make GitHub Actions exploitable: script
# injection, tokens with more access than a job needs, unpinned actions, credentials left
# in the checkout. Results appear under Security > Code scanning, and any finding fails
# the check. Run the same audit locally with `uvx --no-build zizmor@1.31.1 .github/workflows`.
name: Workflow security

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code and look up the actions the workflows use
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Audit the workflows for code scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build zizmor@1.31.1 --format sarif --no-exit-codes .github/workflows > zizmor.sarif

      # GitHub makes fork pull requests' tokens read-only, so those are audited without uploading.
      - name: Upload the audit to GitHub code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build zizmor@1.31.1 .github/workflows
