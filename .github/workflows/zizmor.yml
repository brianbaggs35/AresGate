# Audits the workflow files for the mistakes that make GitHub Actions exploitable: script
# injection, tokens with more access than a job needs, unpinned actions, credentials left
# in the checkout. Results appear under Security > Code scanning, and any finding fails
# the check. Run the same audit locally with `uvx --no-build zizmor@1.31.1 .github/workflows`.
name: Workflow security

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code and look up the actions the workflows use
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Audit the workflows for code scanning
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build zizmor@1.31.1 --format sarif --no-exit-codes .github/workflows > zizmor.sarif

      # GitHub makes fork pull requests' tokens read-only, so those are audited without uploading.
      - name: Upload the audit to GitHub code scanning
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build zizmor@1.31.1 .github/workflows
