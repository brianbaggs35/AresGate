; Replaces the production api program in the e2e image (see the Dockerfile's e2e target).
[program:api]
command=/app/docker/e2e/start-api.sh
directory=/app/backend
user=aresgate
environment=HOME="/app"
priority=20
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
