; Replaces the production worker program in the e2e image (see the Dockerfile's e2e target). The
; specs decide when the collectors run and whether the worker has reported in, through the test
; harness, so a real worker doing it on its own schedule would only make them unreliable.
[program:worker]
command=/app/docker/start-worker.sh
directory=/app/backend
user=aresgate
environment=HOME="/app"
autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
