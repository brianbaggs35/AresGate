# The master process only reads config and opens logs; workers, which handle every
# request, run as the unprivileged "nginx" user. It listens on 8080/8443 inside the
# container, which docker-compose maps to 80/443 on the host.
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    # API requests are small JSON documents, and short timeouts guard against slow-client attacks.
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time $request_id';
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    # Credential checks (sign-in, setup, codes, passkeys): 10 a minute per address after a
    # burst. An empty key isn't limited, so reading the session state stays free.
    map $request_method $auth_limit_key {
        GET "";
        HEAD "";
        default $binary_remote_addr;
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/conf.d/*.conf;
}
