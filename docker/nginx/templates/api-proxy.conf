# Shared by every /api/ location in aresgate.conf, which each set their own proxy_read_timeout.
limit_req zone=api burst=40 nodelay;

proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Whatever the client sent is replaced, so the ID in the API's log and in nginx's is nginx's.
proxy_set_header X-Request-ID $request_id;

include /etc/nginx/aresgate/security-headers.conf;
add_header Cache-Control "no-store" always;
