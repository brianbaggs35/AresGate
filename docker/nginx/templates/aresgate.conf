# Rendered at startup by entrypoint.sh; ${ARESGATE_*} placeholders are filled from the
# environment. nginx's own $variables are left untouched.

# Plain HTTP only ever redirects to an HTTPS address AresGate answers on, whatever Host header
# the request carried: localhost, which works on the computer that runs AresGate whatever the
# server name is, and the server name for anything else.
map $host $aresgate_redirect_host {
    default ${ARESGATE_SERVER_NAME};
    localhost localhost;
}

server {
    listen 8080 default_server;
    server_name _;

    location / {
        return 301 https://$aresgate_redirect_host${ARESGATE_HTTPS_PORT_SUFFIX}$request_uri;
    }
}

# A TLS connection that doesn't ask for AresGate by name (an IP scan, a DNS-rebinding
# page) is refused during the handshake, before any request is read.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    # The configured name, plus localhost for the container's own healthcheck.
    server_name ${ARESGATE_SERVER_NAMES};

    ssl_certificate ${ARESGATE_TLS_CERT};
    ssl_certificate_key ${ARESGATE_TLS_KEY};

    # Mozilla "modern" profile: TLS 1.3 only, with OpenSSL's default key exchange groups.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/aresgate/security-headers.conf;

    # Sign-in, setup and account security (where passwords, codes and passkeys are
    # checked) get a much tighter per-address limit, not counting GET requests, and small
    # bodies. The API also locks out an account after repeated wrong answers.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
        include /etc/nginx/aresgate/api-proxy.conf;
    }

    location /api/account/ {
        limit_req zone=auth burst=20 nodelay;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
        include /etc/nginx/aresgate/api-proxy.conf;
    }

    # An AI answers when it has finished, and a model on a slow computer can take minutes. The API
    # gives up on a provider after 300 seconds, so nginx waits a little longer than that.
    location /api/ai/ {
        proxy_read_timeout 330s;
        include /etc/nginx/aresgate/api-proxy.conf;
    }

    location /api/ {
        proxy_read_timeout 60s;
        include /etc/nginx/aresgate/api-proxy.conf;
    }

    include /etc/nginx/aresgate/app.conf;
}
