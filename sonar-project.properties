# SonarQube Cloud analysis, run by the SonarQube job in .github/workflows/ci.yml. The
# organization and project keys must match SonarQube Cloud's, and the project's Automatic
# Analysis must be off, because CI sends the analysis (and the coverage reports) instead.
sonar.organization=brianbaggs35
sonar.projectKey=brianbaggs35_AresGate
sonar.projectName=AresGate
sonar.sourceEncoding=UTF-8

# What ships: the API and its migrations, the web app, and the CI workflows that build and
# publish it.
sonar.sources=backend/app,backend/migrations,frontend/src,.github
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/test/**

# Tests and test tooling, checked with the rules for tests: the unit tests, the web app's test
# helpers, and the end-to-end tests with the harness they reset the database through (the
# production image doesn't contain it).
sonar.tests=backend/tests,backend/e2e,frontend/src,frontend/e2e
sonar.test.inclusions=backend/tests/**,backend/e2e/**,frontend/src/**/*.spec.ts,frontend/src/test/**,frontend/e2e/**

sonar.python.version=3.14
# Written by pytest and vitest in the Backend and Frontend jobs, with a 95% minimum and a
# 100% coverage target.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Everything else is measured. These have no unit tests: the migrations, which the Backend
# job runs up and down on Postgres, and CI's scripts.
sonar.coverage.exclusions=backend/migrations/**,.github/**

# Postgres has no password on purpose: it only listens on a unix socket and trusts the
# operating system's user (peer auth), so there's no password to leak.
sonar.issue.ignore.multicriteria=peerauth
sonar.issue.ignore.multicriteria.peerauth.ruleKey=python:S2115
sonar.issue.ignore.multicriteria.peerauth.resourceKey=backend/app/config.py
