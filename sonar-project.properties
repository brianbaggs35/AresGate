# SonarQube Cloud analysis, run by the SonarQube job in .github/workflows/ci.yml. The
# organization and project keys must match SonarQube Cloud's, and the project's Automatic
# Analysis must be off, because CI sends the analysis (and the coverage reports) instead.
sonar.organization=brianbaggs35
sonar.projectKey=brianbaggs35_AresGate
sonar.projectName=AresGate
sonar.sourceEncoding=UTF-8

# What ships: the API and its migrations, the web app, and the CI workflows that build and
# publish it.
sonar.sources=backend/app,backend/migrations,frontend/src,.github
sonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/test/**

# Tests and test tooling, checked with the rules for tests: the unit tests, the web app's test
# helpers, and the end-to-end tests with the harness they reset the database through (the
# production image doesn't contain it).
sonar.tests=backend/tests,backend/e2e,frontend/src,frontend/e2e
sonar.test.inclusions=backend/tests/**,backend/e2e/**,frontend/src/**/*.spec.ts,frontend/src/test/**,frontend/e2e/**

sonar.python.version=3.14
# Written by pytest and vitest in the Backend and Frontend jobs, with a 95% minimum and a
# 100% coverage target.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# Everything else is measured. These have no unit tests: the migrations, which the Backend
# job runs up and down on Postgres, and CI's scripts.
sonar.coverage.exclusions=backend/migrations/**,.github/**

# Postgres has no password on purpose: it only listens on a unix socket and trusts the
# operating system's user (peer auth), so there's no password to leak.
sonar.issue.ignore.multicriteria=peerauth,totp,pinnedcert,pinnedhost,policyip,redactionip,noiseip,exampleip,examplehttp,guideip,guidehttp,addresshttp,sampleip,virustotalip,focusablechart,focusablecall
sonar.issue.ignore.multicriteria.peerauth.ruleKey=python:S2115
sonar.issue.ignore.multicriteria.peerauth.resourceKey=backend/app/config.py
# Authenticator-app codes are HMAC-SHA1 (RFC 4226 and 6238): that is what every authenticator app
# computes, and HMAC does not weaken with SHA-1 as a plain hash does. The code is single-use and
# guesses are limited, which is what protects the account.
sonar.issue.ignore.multicriteria.totp.ruleKey=python:S4790
sonar.issue.ignore.multicriteria.totp.resourceKey=backend/app/security/totp.py
# A self-signed device is trusted by pinning its certificate's fingerprint, which a certificate
# authority can't do. For that one connection the certificate chain and name aren't checked, and
# the fingerprint is compared before anything is sent (app/integrations/netguard.py, tested in
# tests/test_netguard.py). The same context reads the certificate a device presents so that its
# fingerprint can be shown for the person to confirm: nothing is sent over that connection.
sonar.issue.ignore.multicriteria.pinnedcert.ruleKey=python:S4830
sonar.issue.ignore.multicriteria.pinnedcert.resourceKey=backend/app/integrations/netguard.py
sonar.issue.ignore.multicriteria.pinnedhost.ruleKey=python:S5527
sonar.issue.ignore.multicriteria.pinnedhost.resourceKey=backend/app/integrations/netguard.py

# The address policy is made of the private network ranges themselves, so they are written out.
sonar.issue.ignore.multicriteria.policyip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.policyip.resourceKey=backend/app/integrations/netguard.py
# The AI's redaction decides which addresses belong to a home network, so it lists those ranges
# (and the ones that name no device) itself.
sonar.issue.ignore.multicriteria.redactionip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.redactionip.resourceKey=backend/app/ai/redaction.py
# The noise filters say which alerts are between addresses inside the network by the private
# ranges themselves (the dashboard's noise report counts them the same way), so they write them out.
sonar.issue.ignore.multicriteria.noiseip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.noiseip.resourceKey=backend/app/incidents/filters.py
# What each integration's address field shows as its example (a private address, as the product
# would be reached at), and, for ntopng and CrowdSec, the plain http:// their products speak by
# default. The web app warns before anyone uses an http:// address, and the example is only a hint.
sonar.issue.ignore.multicriteria.exampleip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.exampleip.resourceKey=backend/app/integrations/registry.py
sonar.issue.ignore.multicriteria.examplehttp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.examplehttp.resourceKey=backend/app/integrations/registry.py
# The setup instructions show the same examples (a private address, and the plain http:// that
# ntopng and CrowdSec speak by default) beside the fields they are typed into.
sonar.issue.ignore.multicriteria.guideip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.guideip.resourceKey=backend/app/integrations/guides.py
sonar.issue.ignore.multicriteria.guidehttp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.guidehttp.resourceKey=backend/app/integrations/guides.py
# The AI provider form shows an example Ollama address as the field's placeholder (a private address
# on plain http://, which is how Ollama listens by default). It is only a hint.
sonar.issue.ignore.multicriteria.addresshttp.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.addresshttp.resourceKey=frontend/src/components/AiProviderForm.vue

# The sample alert shows an incident that is made up: an address on the internet that it came from
# and a device on the home network that it touched. They are written out so that the message is
# the same every time it is shown.
sonar.issue.ignore.multicriteria.sampleip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.sampleip.resourceKey=backend/app/alerts/message.py
# The VirusTotal key test asks VirusTotal for one public address that always has a report, so that a
# key is checked on an address it knows. That address is written out in intel/connection.py on purpose.
sonar.issue.ignore.multicriteria.virustotalip.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.virustotalip.resourceKey=backend/app/intel/connection.py

# A chart takes the keyboard on purpose (tabindex="0"): the arrow keys move through its points and
# a screen reader is read each one, which a picture with no way in could not do. Its table, which
# scrolls, takes focus too, or the keyboard could not reach the rows that are out of sight.
sonar.issue.ignore.multicriteria.focusablechart.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.focusablechart.resourceKey=frontend/src/charts/**
# What was sent to a provider, and what it answered, are long and scroll inside the dialog that shows
# them. They take focus (tabindex="0") so the keyboard can scroll them, or whoever uses one could
# not read the part that is out of sight.
sonar.issue.ignore.multicriteria.focusablecall.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.focusablecall.resourceKey=frontend/src/components/AiCallDialog.vue
